<div class="min-h-screen bg-muted flex">

    <!-- SIDEBAR -->
    <aside class="
        fixed inset-y-0 left-0 z-50
        h-screen w-64
        bg-white shadow-lg
        transform transition-transform duration-300

        lg:sticky
        lg:top-0
        lg:self-start
        lg:translate-x-0
    " [class.translate-x-0]="
        isSidebarOpen
    " [class.-translate-x-full]="
        !isSidebarOpen
    ">

        <div class="h-full flex flex-col">

            <!-- LOGO -->
            <div class="h-16 flex items-center justify-between px-6 border-b border-gray-200">

                <a routerLink="/" class="text-2xl text-primary font-bold">
                    IRRITERRA
                </a>

                <button class="lg:hidden p-2 rounded-lg hover:bg-gray-100" (click)="closeSidebar()">
                    <lucide-icon [img]="X" class="w-6 h-6"></lucide-icon>
                </button>

            </div>

            <!-- MENU -->
            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">

                @for (
                item
                of menuItemsVisibles();
                track item.path
                ) {

                <a [routerLink]="item.path" routerLinkActive="bg-primary text-white" [routerLinkActiveOptions]="{
                    exact: item.path === '/dashboard'
                    }"
                    class="flex items-center space-x-3 px-4 py-3 rounded-lg transition-colors text-gray-700 hover:bg-gray-100"
                    (click)="closeSidebar()">

                    <lucide-icon [img]="item.icon" class="w-5 h-5">
                    </lucide-icon>


                    <span>

                        {{
                        t(
                        item.label.es,
                        item.label.en
                        )
                        }}

                    </span>

                </a>

                }

            </nav>

        </div>

    </aside>

    <!-- MAIN -->
    <div class="min-w-0 flex-1 flex flex-col min-h-screen">

        <!-- TOP BAR -->
        <header class="h-16 bg-white shadow-sm flex items-center justify-between px-4 lg:px-8">

            <button class="lg:hidden p-2 rounded-lg hover:bg-gray-100" (click)="toggleSidebar()">
                <lucide-icon [img]="Menu" class="w-6 h-6"></lucide-icon>
            </button>

            <div class="flex-1"></div>

            <div class="flex items-center space-x-4">



                <!-- ================================================= -->
                <!-- USER MENU -->
                <!-- ================================================= -->

                <div class="relative" (click)="
    $event.stopPropagation()
">


                    <!-- Botón usuario -->

                    <button type="button" (click)="
        toggleUserMenu(
            $event
        )
    " [attr.aria-expanded]="
        userMenuOpen()
    " aria-haspopup="menu"
                        class="flex items-center gap-3 rounded-lg px-2 py-2 transition-colors hover:bg-gray-100 sm:px-3">


                        <!-- Foto -->

                        @if (
                        fotoActual()
                        ) {

                        <img [src]="
                fotoActual()!
            " [alt]="
                nombreCompleto()
            " class="h-9 w-9 rounded-full border border-gray-200 object-cover" />

                        } @else {

                        <div
                            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-primary text-xs font-semibold text-white">

                            {{
                            iniciales()
                            }}

                        </div>

                        }


                        <!-- Información -->

                        <div class="hidden min-w-0 text-left sm:block">

                            <p class="max-w-48 truncate text-sm font-medium text-gray-800">

                                {{
                                nombreCompleto()
                                }}

                            </p>


                            <p class="max-w-48 truncate text-xs text-gray-500">

                                {{
                                rolActual()
                                }}

                            </p>

                        </div>


                        <!-- Flecha -->

                        <lucide-icon [img]="ChevronDown" class="
        h-4 w-4
        text-gray-400
        transition-transform
        duration-200
        ease-out
    " [class.rotate-180]="
        userMenuOpen()
    ">
                        </lucide-icon>

                    </button>


                    <!-- ================================================= -->
                    <!-- DROPDOWN -->
                    <!-- ================================================= -->



                    <div role="menu" [attr.aria-hidden]="
        !userMenuOpen()
    " [attr.inert]="
        userMenuOpen()
            ? null
            : ''
    " class="
        absolute right-0 top-full z-50 mt-2
        w-72
        origin-top-right
        overflow-hidden
        rounded-xl
        border border-gray-200
        bg-white
        shadow-lg

        transform-gpu

        transition-all
        duration-200
        ease-out
    " [class.opacity-100]="
        userMenuOpen()
    " [class.translate-y-0]="
        userMenuOpen()
    " [class.scale-100]="
        userMenuOpen()
    " [class.pointer-events-auto]="
        userMenuOpen()
    " [class.opacity-0]="
        !userMenuOpen()
    " [class.-translate-y-2]="
        !userMenuOpen()
    " [class.scale-95]="
        !userMenuOpen()
    " [class.pointer-events-none]="
        !userMenuOpen()
    ">


                        <!-- Información del usuario -->

                        <div class="border-b border-gray-100 px-4 py-4">

                            <p class="truncate text-sm font-semibold text-gray-900">

                                {{
                                nombreCompleto()
                                }}

                            </p>


                            @if (
                            correoActual()
                            ) {

                            <p class="mt-1 truncate text-xs text-gray-500">

                                {{
                                correoActual()
                                }}

                            </p>

                            }


                            @if (
                            rolActual()
                            ) {

                            <span
                                class="mt-2 inline-flex rounded-full bg-primary/10 px-2.5 py-1 text-xs font-medium text-primary">

                                {{
                                rolActual()
                                }}

                            </span>

                            }

                        </div>


                        <!-- Opciones -->

                        <div class="p-2">


                            <!-- Configuración -->

                            <a routerLink="/dashboard/settings" role="menuitem" (click)="
                    closeUserMenu()
                " class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-700 transition hover:bg-gray-100">

                                <lucide-icon [img]="Settings" class="h-4 w-4 text-gray-500">
                                </lucide-icon>


                                <span>

                                    {{
                                    t(
                                    'Configuración',
                                    'Settings'
                                    )
                                    }}

                                </span>

                            </a>


                            <!-- Cerrar sesión -->

                            <button type="button" role="menuitem" (click)="
                    logout()
                " class="mt-1 flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-medium text-red-600 transition hover:bg-red-50">

                                <lucide-icon [img]="LogOut" class="h-4 w-4">
                                </lucide-icon>


                                <span>

                                    {{
                                    t(
                                    'Cerrar sesión',
                                    'Logout'
                                    )
                                    }}

                                </span>

                            </button>

                        </div>

                    </div>



                </div>

            </div>

        </header>

        <!-- PAGE CONTENT -->
        <main class="flex-1 p-4 lg:p-8">
            <router-outlet></router-outlet>
        </main>

    </div>

    <!-- OVERLAY -->
    @if (isSidebarOpen) {
    <div class="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden" (click)="closeSidebar()"></div>
    }

</div>
