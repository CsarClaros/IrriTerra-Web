<div
    class="space-y-6">


    <!--
    ========================================================================
    ENCABEZADO
    ========================================================================
    -->

    <div>

        <h1
            class="text-2xl font-semibold text-gray-900">

            Reportes

        </h1>


        <p
            class="mt-1 text-sm text-gray-500">

            Consulte la información operativa disponible según sus permisos.

        </p>

    </div>


    <!--
    ========================================================================
    REPORTES DISPONIBLES
    ========================================================================
    -->

    @if (
        reportesVisibles().length
        > 0
    ) {

        <div
            class="grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-3">

            @for (
                reporte
                of reportesVisibles();
                track reporte.path
            ) {

                <a
                    [routerLink]="
                        reporte.path
                    "

                    class="group rounded-xl border border-gray-200 bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:border-primary/30 hover:shadow-md">


                    <!-- Icono -->

                    <div
                        class="flex items-start justify-between">

                        <div
                            class="rounded-xl bg-primary/10 p-3">

                            <lucide-angular
                                [img]="
                                    reporte.icono
                                "

                                class="h-6 w-6 text-primary">
                            </lucide-angular>

                        </div>


                        <lucide-angular
                            [img]="ArrowRight"

                            class="h-5 w-5 text-gray-300 transition group-hover:translate-x-1 group-hover:text-primary">
                        </lucide-angular>

                    </div>


                    <!-- Información -->

                    <div
                        class="mt-5">

                        <h2
                            class="text-lg font-semibold text-gray-900">

                            {{ reporte.titulo }}

                        </h2>


                        <p
                            class="mt-2 text-sm leading-6 text-gray-500">

                            {{ reporte.descripcion }}

                        </p>

                    </div>


                    <!-- Acción -->

                    <div
                        class="mt-5 border-t border-gray-100 pt-4">

                        <span
                            class="text-sm font-medium text-primary">

                            Ver reporte

                        </span>

                    </div>

                </a>

            }

        </div>

    } @else {

        <div
            class="rounded-xl border border-gray-200 bg-white p-10 text-center shadow-sm">

            <p
                class="text-sm text-gray-500">

                No tiene reportes disponibles.

            </p>

        </div>

    }

</div>
